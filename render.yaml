services:
  - type: web
    name: terratrend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/catalog
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: HOST
        value: 0.0.0.0
